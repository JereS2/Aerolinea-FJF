<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase de abordar — AERO FJF</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div id="navbar"></div>

  <main>
    <div class="page">
      <div class="page-title"><h1>Pase de abordar</h1></div>

      <div class="boarding-pass" id="boarding-pass">
        <div class="boarding-pass-header">
          <div>
            <div>AERO FJF</div>
            <div class="boarding-pass-code" id="bp-codigo"></div>
          </div>
          <div style="text-align:right;">
            <div>Vuelo</div>
            <strong id="bp-vuelo-num"></strong>
          </div>
        </div>

        <div class="boarding-pass-grid">
          <div><span>Pasajero</span><strong id="bp-pasajero"></strong></div>
          <div><span>Asiento(s)</span><strong id="bp-asientos"></strong></div>
          <div><span>Origen</span><strong id="bp-origen"></strong></div>
          <div><span>Destino</span><strong id="bp-destino"></strong></div>
          <div><span>Fecha</span><strong id="bp-fecha"></strong></div>
          <div><span>Hora de salida</span><strong id="bp-hora"></strong></div>
        </div>

        <div class="boarding-pass-qr">
          <canvas id="bp-qr" width="120" height="120"></canvas>
        </div>
      </div>

      <div class="page-narrow no-print" style="margin-top:20px;">
        <button id="btn-imprimir" class="btn btn-primary btn-block">Imprimir pase</button>
        <a href="historial-reservas.html" class="btn btn-secondary btn-block" style="margin-top:10px;">Volver a mis reservas</a>
      </div>
    </div>
  </main>

  <footer class="no-print">
    <p>AERO FJF &copy; 2026 — Proyecto académico DSY1104</p>
  </footer>

  <script src="../js/users.js"></script>
  <script src="../js/flights.js"></script>
  <script src="../js/seats.js"></script>
  <script src="../js/reservations.js"></script>
  <script src="../js/validations.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // Dibuja un patrón tipo código QR (simulado, no escaneable) determinado
    // por el texto dado, para dar apariencia visual al pase de abordar.
    function dibujarQrSimulado(canvas, texto) {
      const ctx = canvas.getContext('2d');
      const size = 12;
      const cells = canvas.width / size;
      let seed = 0;
      for (let i = 0; i < texto.length; i++) seed = (seed * 31 + texto.charCodeAt(i)) >>> 0;

      // Generador pseudoaleatorio simple (LCG) para pintar celdas del QR.
      function nextBit() {
        seed = (seed * 1103515245 + 12345) >>> 0;
        return (seed >> 16) & 1;
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0b3d91';
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          const esEsquina = (x < 3 && y < 3) || (x >= cells - 3 && y < 3) || (x < 3 && y >= cells - 3);
          if (esEsquina ? (x % 2 === 0 && y % 2 === 0) : nextBit()) {
            ctx.fillRect(x * size, y * size, size, size);
          }
        }
      }
    }

    // Al cargar la página: exige sesión, busca la reserva y muestra los
    // datos del pase de abordar con su QR simulado.
    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth();
      if (!user) return;

      const reservaId = getQueryParam('reservaId');
      const reserva = getReservationById(reservaId);

      if (!reserva || (reserva.usuarioEmail !== user.email && user.rol !== 'admin')) {
        showToast('Reserva no encontrada.', 'danger');
        setTimeout(() => location.href = 'historial-reservas.html', 800);
        return;
      }

      const vuelo = getFlightById(reserva.vueloId);
      const pasajero = findUserByEmail(reserva.usuarioEmail);

      document.getElementById('bp-codigo').textContent = reserva.id;
      document.getElementById('bp-vuelo-num').textContent = vuelo.codigo;
      document.getElementById('bp-pasajero').textContent = pasajero ? pasajero.nombre : reserva.usuarioEmail;
      document.getElementById('bp-asientos').textContent = reserva.asientos.join(', ');
      document.getElementById('bp-origen').textContent = vuelo.origen;
      document.getElementById('bp-destino').textContent = vuelo.destino;
      document.getElementById('bp-fecha').textContent = formatDate(vuelo.fechaSalida);
      document.getElementById('bp-hora').textContent = vuelo.horaSalida;

      dibujarQrSimulado(document.getElementById('bp-qr'), reserva.id);

      document.getElementById('btn-imprimir').addEventListener('click', () => window.print());
    });
  </script>
</body>
</html>
