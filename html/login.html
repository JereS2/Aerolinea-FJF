<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — AERO FJF</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div id="navbar"></div>

  <main>
    <div class="page-narrow">
      <div class="card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Accede a tu cuenta de pasajero o administrador.</p>

        <form id="form-login" novalidate>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" maxlength="100" required>
            <span class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="contraseña" required>
            <span class="error-message"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>

        <p style="margin-top:16px;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <p class="help-text">Demo admin: admin@duoc.cl / admin123 — Demo pasajero: pasajero@gmail.com / 1234</p>
      </div>
    </div>
  </main>

  <footer>
    <p>AERO FJF &copy; 2026 — Proyecto académico DSY1104</p>
  </footer>

  <script src="../js/users.js"></script>
  <script src="../js/flights.js"></script>
  <script src="../js/seats.js"></script>
  <script src="../js/reservations.js"></script>
  <script src="../js/validations.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // Al cargar la página: si ya hay sesión, redirige; si no, prepara el
    // formulario de login.
    document.addEventListener('DOMContentLoaded', () => {
      if (getCurrentUser()) {
        location.href = 'historial-reservas.html';
        return;
      }

      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('contraseña');
      const form = document.getElementById('form-login');

      // Al enviar el formulario: valida los campos y, si son correctos,
      // intenta iniciar sesión y redirige según el rol del usuario.
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let valid = true;

        if (!isRequired(emailInput.value)) {
          setFieldError(emailInput, 'El correo es obligatorio.');
          valid = false;
        } else {
          clearFieldError(emailInput);
        }

        if (!isRequired(passInput.value)) {
          setFieldError(passInput, 'La contraseña es obligatoria.');
          valid = false;
        } else {
          clearFieldError(passInput);
        }

        if (!valid) return;

        try {
          const user = loginUser(emailInput.value.trim(), passInput.value);
          showToast(`Bienvenido, ${user.nombre}`, 'success');
          setTimeout(() => {
            location.href = user.rol === 'admin' ? '../admin/index.html' : 'historial-reservas.html';
          }, 500);
        } catch (err) {
          setFieldError(passInput, err.message);
        }
      });
    });
  </script>
</body>
</html>
